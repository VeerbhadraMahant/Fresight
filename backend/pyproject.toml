[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",   # line length handled case-by-case; long tables/URLs are fine
    "B008",   # FastAPI Depends()/Field() in defaults is idiomatic
    "SIM108", # ternary-vs-if: keep explicit where clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
