# Render.com blueprint.  In the Render dashboard:  New > Blueprint > pick this repo.
#
#   freightsight-api  Docker web service (FastAPI)
#   freightsight-web  static site (the built SPA), calling the API cross-origin
#
# Service URLs on Render are deterministic (https://<name>.onrender.com), so the
# API base and the CORS allow-list are wired below with no manual step.

services:
  - type: web
    name: freightsight-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: FREIGHTSIGHT_SKIP_LIVE_PROBE
        value: "1"
      - key: FREIGHTSIGHT_LOG_LEVEL
        value: INFO
      - key: FREIGHTSIGHT_CORS_ORIGINS
        value: https://freightsight-web.onrender.com

  - type: web
    name: freightsight-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        value: https://freightsight-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
