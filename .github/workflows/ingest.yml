name: ingest

# The self-updating pipeline. Runs outside the web service, writes to Supabase.
# GitHub's scheduler is best-effort on free runners (often 5-15 min late) -- fine
# for a 15-minute cadence.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: run ingest
        run: python -m worker.ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FREIGHTSIGHT_LIVE_REFRESH_BUDGET: "150"
          FREIGHTSIGHT_LOG_LEVEL: INFO
